# Domínio OSB-only, adaptado de:
# oracle/docker-images/OracleSOASuite/samples/docker-compose.yml
# (removidos os serviços soaas/soams/bpmas/bpmms, que não são
# necessários só para testar o Service Bus).

services:
  #
  # Base de dados Oracle (schemas RCU do OSB vivem aqui)
  #
  soadb:
    image: ${DC_REGISTRY_DB}/oracle/database:12.2.0.1-ee
    container_name: soadb
    ports:
      - "${DC_ORCL_PORT}:1521"
      - "${DC_ORCL_OEM_PORT}:5500"
    environment:
      - ORACLE_SID=${DC_ORCL_SID}
      - ORACLE_PDB=${DC_ORCL_PDB}
      - ORACLE_PWD=${DC_ORCL_SYSPWD}
    volumes:
      - ${DC_ORCL_DBDATA}:/opt/oracle/oradata

  #
  # OSB Admin Server (console em :7001)
  #
  osbas:
    image: ${DC_REGISTRY_SOA}/oracle/soasuite:${DC_SOA_VERSION}
    container_name: osbas
    depends_on:
      - soadb
    command: /bin/bash -c "sleep 5s; /u01/oracle/container-scripts/createDomainAndStart.sh"
    ports:
      - "7001:7001"
    environment:
      - DOMAIN_TYPE=osb
      - ADMIN_HOST=${DC_HOSTNAME}
      - ADMIN_PASSWORD=${DC_ADMIN_PWD}
      - CONNECTION_STRING=${DC_ORCL_HOST}:${DC_ORCL_PORT}/${DC_ORCL_PDB}
      - DB_PASSWORD=${DC_ORCL_SYSPWD}
      - DB_SCHEMA_PASSWORD=${DC_RCU_SCHPWD}
      - RCUPREFIX=${DC_RCU_OSBPFX}
      - MANAGED_SERVER=osb_server1
      - EXTRA_JAVA_PROPERTIES=-Djava.net.preferIPv4Stack=true
    volumes:
      - ${DC_DDIR_OSB}:/u01/oracle/user_projects

  #
  # OSB Managed Server (runtime das proxies em :9001/:9002)
  #
  osbms:
    image: ${DC_REGISTRY_SOA}/oracle/soasuite:${DC_SOA_VERSION}
    container_name: osbms
    depends_on:
      - osbas
    command: /bin/bash -c "/u01/oracle/container-scripts/startMS.sh"
    ports:
      - "9001:9001"
      - "9002:9002"
    environment:
      - DOMAIN_TYPE=osb
      - ADMIN_HOST=osbas
      - ADMIN_PORT=7001
      - ADMIN_PASSWORD=${DC_ADMIN_PWD}
      - adminhostname=osbas
      - adminport=7001
      - MANAGED_SERVER=osb_server1
      - MANAGED_SERVER_CONTAINER=true
      - MANAGEDSERVER_PORT=9001
      - EXTRA_JAVA_PROPERTIES=-Djava.net.preferIPv4Stack=true
    volumes:
      - ${DC_DDIR_OSB}:/u01/oracle/user_projects
